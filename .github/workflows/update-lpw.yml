name: Update real-time LPW

on:
  schedule:
    # GitHub can delay or drop scheduled events. Two off-peak attempts per hour
    # provide a fallback; the freshness gate below prevents duplicate model runs.
    - cron: "13,43 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Ignore the freshness gate and run a full update"
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  pages: write

concurrency:
  group: update-lpw
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out website
        uses: actions/checkout@v5

      - name: Refresh default branch
        run: git pull --ff-only origin "${GITHUB_REF_NAME}"

      - name: Check whether an LPW update is due
        id: freshness
        shell: bash
        env:
          FORCE_UPDATE: ${{ inputs.force }}
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          is_dispatch = os.environ.get("GITHUB_EVENT_NAME") == "workflow_dispatch"
          force_update = os.environ.get("FORCE_UPDATE", "").lower() == "true"
          due = is_dispatch and force_update
          manifest_path = Path("lpw/data/manifest.json")
          if not due:
              due = True
              if manifest_path.exists():
                  manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
                  updated_at = manifest.get("updated_at")
                  if updated_at:
                      last_update = datetime.fromisoformat(updated_at.replace("Z", "+00:00"))
                      due = datetime.now(timezone.utc) - last_update >= timedelta(minutes=45)

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"run={'true' if due else 'false'}\n")
          print("Running the full LPW update." if due else "A successful update is less than 45 minutes old; skipping this fallback run.")
          PY

      - name: Set up Python
        if: steps.freshness.outputs.run == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: lpw/pipeline/requirements.txt

      - name: Install data-pipeline dependencies
        if: steps.freshness.outputs.run == 'true'
        run: python -m pip install -r lpw/pipeline/requirements.txt

      - name: Verify MATLAB-to-Python model parity
        if: steps.freshness.outputs.run == 'true'
        working-directory: lpw/pipeline
        run: python -m unittest -v test_lpw_model.py

      - name: Generate latest MIMIC NetCDF release asset
        if: steps.freshness.outputs.run == 'true'
        working-directory: lpw/pipeline
        run: python github_release_archive.py --hours 96 --output-directory "${RUNNER_TEMP}/mimic-release"

      - name: Read MIMIC release metadata
        if: steps.freshness.outputs.run == 'true'
        id: mimic_release
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          metadata = json.loads((Path(os.environ["RUNNER_TEMP"]) / "mimic-release" / "release-upload.json").read_text())
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"asset_path={metadata.get('asset_path', '')}\n")
              output.write(f"release_tag={metadata.get('release_tag', '')}\n")
          PY

      - name: Upload MIMIC NetCDF to repository release
        if: steps.mimic_release.outputs.asset_path != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_PATH: ${{ steps.mimic_release.outputs.asset_path }}
          RELEASE_TAG: ${{ steps.mimic_release.outputs.release_tag }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --title "MIMIC LPW ${RELEASE_TAG#mimic-lpw-}" \
              --notes "Hourly global 0.25-degree MIMIC layered precipitable water NetCDF products." \
              --latest=false
          fi
          gh release upload "$RELEASE_TAG" "$ASSET_PATH" --clobber

      - name: Refresh rolling browser LPW dataset
        if: steps.freshness.outputs.run == 'true'
        working-directory: lpw/pipeline
        run: python update_data.py --hours 72 --max-new 1

      - name: Commit updated rolling dataset
        if: steps.freshness.outputs.run == 'true'
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lpw/data
          if git diff --cached --quiet; then
            echo "No LPW data changes."
          else
            git commit -m "data: update real-time LPW"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Request GitHub Pages rebuild
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds" || echo "Pages is already managed by a separate deployment workflow."
