name: Update real-time LPW

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: update-lpw
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out website
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: lpw/pipeline/requirements.txt

      - name: Install data-pipeline dependencies
        run: python -m pip install -r lpw/pipeline/requirements.txt

      - name: Verify MATLAB-to-Python model parity
        working-directory: lpw/pipeline
        run: python -m unittest -v test_lpw_model.py

      - name: Fetch MIMIC TPW and calculate LPW
        working-directory: lpw/pipeline
        run: python update_data.py --hours 72 --max-new 8

      - name: Commit updated rolling dataset
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lpw/data
          if git diff --cached --quiet; then
            echo "No LPW data changes."
          else
            git commit -m "data: update real-time LPW"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Request GitHub Pages rebuild
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds" || echo "Pages is already managed by a separate deployment workflow."
